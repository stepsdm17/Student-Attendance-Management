{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="text-primary-custom">Classes</h1>
    <a href="{% url 'class_create' %}" class="btn btn-primary">+ Add New Class</a>
</div>

<div class="card">
    <div class="card-body p-0">
        <table class="table mb-0">
            <thead>
                <tr>
                    <th>Class Name</th>
                    <th>Capacity</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for class_room in classes %}
                <tr>
                    <td>{{ class_room.class_name }}</td>
                    <td>{{ class_room.capacity }}</td>
                    <td class="d-flex gap-1">
                        <a href="{% url 'class_detail' pk=class_room.id %}" class="btn btn-sm btn-info">View</a>
                        <a href="{% url 'class_delete' pk=class_room.id %}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-secondary py-4">No classes found. <a href="{% url 'class_create' %}">Add one now.</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
