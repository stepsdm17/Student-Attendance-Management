{% extends 'base.html' %}

{% block content %}
<style>
    .table {
        border-radius: 12px;
        overflow: hidden;
        border: 0.5px solid #c7d2fe;
        border-collapse: separate !important;
        border-spacing: 0;
    }

    .table thead {
        background: #4338ca;
        color: #e0e7ff;
    }

    .table thead th {
        border: none;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        padding: 14px 16px;
        font-size: 12px;
    }

    .table tbody tr:nth-child(even) { background: #eef2ff; }
    .table tbody tr:nth-child(odd)  { background: #f5f3ff; }

    .table tbody tr:hover { background: #e0e7ff; }

    .table tbody td {
        padding: 13px 16px;
        border-bottom: 0.5px solid #c7d2fe;
        vertical-align: middle;
    }

    .table tbody tr:last-child td { border-bottom: none; }

    .btn-view   { background: #eef2ff; color: #3730a3; border: 0.5px solid #a5b4fc; }
    .btn-delete { background: #fef2f2; color: #b91c1c; border: 0.5px solid #fca5a5; }

    .btn-add {
        background: #1976d2;
        color: #e0e7ff !important;
        border: none;
    }
    .btn-add:hover { background: #3730a3; }
</style>

<h1>Classes</h1>
<a href="{% url 'class_create' %}" class="btn btn-add mb-3">Add New Class</a>

<table class="table">
    <thead>
        <tr>
            <th>Class Name</th>
            <th>Capacity</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for class_room in classes %}
        <tr>
            <td>{{ class_room.class_name }}</td>
            <td>{{ class_room.capacity }}</td>
            <td>
                <a href="{% url 'class_detail' pk=class_room.id %}" class="btn btn-sm btn-view">View</a>
                <a href="{% url 'class_delete' pk=class_room.id %}" class="btn btn-sm btn-delete">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
