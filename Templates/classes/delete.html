{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>Delete Class</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-danger">
                    Are you sure you want to delete class <strong>{{ class_room.class_name }}</strong>?
                    This action <strong>cannot be undone</strong>.
                </div>
                <form method="post" class="d-flex gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'class_detail' pk=class_room.id %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
