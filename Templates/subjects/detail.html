{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto align-content-center w-800">
        <div class="card">
            <div class="card-header">
                <h4>Subject Details</h4>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Subject Name</label>
                    <p>{{ subject.subject_name }}</p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Code</label>
                    <p><span class="badge bg-secondary">{{ subject.code }}</span></p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <p>{{ subject.description|default:"-" }}</p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Created</label>
                    <p>{{ subject.created_at|date:"M d, Y" }}</p>
                </div>
            </div>
            <div class="card-footer d-flex gap-2">
                <a href="{% url 'subject_delete' pk=subject.id %}" class="btn btn-danger">Delete</a>
                <a href="{% url 'subject_list' %}" class="btn btn-secondary">Back to List</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
